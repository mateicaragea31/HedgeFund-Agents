# E1 ablation "memory off" (CLAUDE.md §6.5): E1 without the decision log, so no lessons from
# earlier decisions reach the Portfolio Manager. Everything else as e1_llama70b.yaml. Without
# memory every cell is independent, so the whole run is one wave (up to 15 cells at once).
name: e1_llama70b_paper_window_nomem
phase: 1
tickers: [AAPL, GOOGL, AMZN]
window: {start: 2024-01-02, end: 2024-03-28}
model_profile: configs/models/llama33_70b_main.yaml   # knowledge_cutoff: 2023-12-31; 3 GPUs, PP 3
quick_model: llama-3.3-70b
deep_model: llama-3.3-70b
analysts: [market, social, news, fundamentals]
max_debate_rounds: 1
max_risk_discuss_rounds: 1
memory: false
holding_period_days: 5
sampling: {temperature: model_default}
repeats: 3
