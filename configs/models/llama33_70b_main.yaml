# `main` profiles (CLAUDE.md §4.3): the replication backbone. One file for both hardware
# profiles; the job records which partition it ran on (main-a100 vs main-h100 must not be mixed
# within one experiment).
#
# 3 GPUs, pipeline parallel: the student account may use at most 3 GPUs per job (sacctmgr,
# 2026-10-30), and tensor parallelism must divide Llama-70B's 8 KV heads (1, 2, 4, 8), so each
# GPU holds a stack of whole layers instead (80 layers ≈ 27 + 27 + 26). Same weights, same bf16.

name: llama-3.3-70b                      # name the vLLM server answers to
profile: main-a100
hf_repo: meta-llama/Llama-3.3-70B-Instruct
revision: 6f6073b423013f6a7d4d9f39144961bfbfbc386b
path: ${AIHF_LAB}/.cache/models--meta-llama--Llama-3.3-70B-Instruct/snapshots/6f6073b423013f6a7d4d9f39144961bfbfbc386b
knowledge_cutoff: 2023-12-31             # model card: "December 2023"; the runner refuses windows starting on or before this

hardware:
  partition: dgxa100
  gpus: 3
  precision: bf16

vllm:                                    # flags for `vllm serve` (vLLM 0.23.0, lab image vllm_v4.sif)
  dtype: bfloat16
  tensor_parallel_size: 1
  pipeline_parallel_size: 3
  max_model_len: 65536
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  enable_auto_tool_choice: true
  tool_call_parser: llama3_json
  chat_template: configs/templates/tool_chat_template_llama3.1_json.jinja   # Llama 3.3 uses the 3.1 format
  seed: 0

chat_template_source:                    # copied byte-for-byte, Apache-2.0
  url: https://github.com/vllm-project/vllm/blob/v0.23.0/examples/tool_chat_template_llama3.1_json.jinja
  sha256: 8aedd05f7ab549b897b929c89da9b62e537f4f4197f33736e9d2f10fea53b1bf
